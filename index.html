<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BM7 — عالم الأبطال</title><link rel="stylesheet" href="bm7.css"><style>#bm7LoginFallback{position:fixed;top:16px;left:16px;z-index:999999;background:#ffc400;color:#111;border:0;border-radius:10px;padding:11px 16px;font-weight:900;cursor:pointer;box-shadow:0 8px 25px #0008}#bm7Loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080b0f;color:#ffc400;font:900 26px Arial;z-index:999998;transition:opacity .45s ease;letter-spacing:.2px}#bm7Loader.hide{opacity:0;pointer-events:none}#bm7Loader span{display:block;text-align:center;text-shadow:0 0 22px #ffc40055}#bm7Loader small{display:block;margin-top:10px;color:#aaa;font-size:11px;font-weight:700;letter-spacing:1px}</style></head><body><div id="bm7Loader"><div><span>صنع بحب لشوق 🤍</span><small>BM7 — عالم الأبطال</small></div></div><button id="bm7LoginFallback" onclick="if(window.bm7OpenAuth)window.bm7OpenAuth();else{window.__bm7AuthRequested=true;this.textContent='⏳ جاري تحميل تسجيل الدخول...'}">🔐 تسجيل الدخول</button><div id="bm7mount"></div><script>window.showSection=window.showSection||function(name,btn){document.querySelectorAll('.section-view').forEach(s=>s.classList.remove('active'));const t=document.getElementById('section-'+name);if(t)t.classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})};window.showToast=window.showToast||function(t){console.log(t)};(async()=>{const m=document.getElementById('bm7mount'),loader=document.getElementById('bm7Loader'),splashStart=performance.now();let appReady=false;const hideSplash=()=>{loader.classList.add('hide');setTimeout(()=>loader.remove(),500)};setTimeout(()=>{if(!appReady){loader.innerHTML='<div><span>🦇 BM7</span><small>جاري التشغيل...</small></div>'}},1600);try{for(const p of ['part1.html','part2.html']){const r=await fetch(p+'?v=26',{cache:'no-store'});if(!r.ok)throw new Error('تعذر تحميل '+p);m.insertAdjacentHTML('beforeend',await r.text())}const files=['core1.js','core2.js','core3.js','core4.js','core5.js','core6.js','core7.js','core8.js','core9.js','bm7-1.js','bm7-2.js','bm7-3.js','boot.js','authfix.js','cleanup.js','chat.js','chatfix.js','avatar.js'];for(const p of files){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=p+'?v=26';s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل '+p));document.body.appendChild(s)})}appReady=true;const wait=Math.max(0,1600-(performance.now()-splashStart));setTimeout(hideSplash,wait);if(window.bm7OpenAuth&&window.__bm7AuthRequested)window.bm7OpenAuth();}catch(e){console.error(e);loader.innerHTML='<div><span>⚠️ تعذر تشغيل BM7</span><small>'+e.message+'</small></div>';window.showToast('تعذر تشغيل BM7: '+e.message)}})();</script></body></html>
