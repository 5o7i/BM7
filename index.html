<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BM7 — عالم الأبطال</title><link rel="stylesheet" href="bm7.css"><style>#bm7LoginFallback{position:fixed;top:16px;left:16px;z-index:999999;background:#ffc400;color:#111;border:0;border-radius:10px;padding:11px 16px;font-weight:900;cursor:pointer;box-shadow:0 8px 25px #0008}#bm7LoginFallback.hidden{display:none}</style></head><body><button id="bm7LoginFallback" onclick="window.bm7OpenAuth?window.bm7OpenAuth():loadAuthFix()">🔐 تسجيل الدخول</button><div id="bm7mount"></div><script>
async function loadAuthFix(){if(window.bm7OpenAuth){window.bm7OpenAuth();return}const old=document.getElementById('bm7AuthRetry');if(old)return;const s=document.createElement('script');s.id='bm7AuthRetry';s.src='core2.js';document.body.appendChild(s);setTimeout(()=>{if(window.bm7OpenAuth)window.bm7OpenAuth()},1800)}
(async()=>{const m=document.getElementById('bm7mount');const parts=['part1.html','part2.html'];for(const p of parts){const r=await fetch(p);if(!r.ok)throw new Error('تعذر تحميل '+p);m.insertAdjacentHTML('beforeend',await r.text())}const s=document.createElement('script');s.src='bm7.js';document.body.appendChild(s);setTimeout(()=>{if(window.bm7OpenAuth){document.getElementById('bm7LoginFallback').classList.add('hidden')}},3000)})().catch(e=>document.body.innerHTML='<pre>'+e+'</pre>');
</script></body></html>
